<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PixelMate Alive Notification</title>
  <desc id="desc">Illustrative screenshot showing PixelMate is alive notification in VS Code.</desc>
  <rect width="1280" height="720" fill="#1E1E1E"/>
  <rect x="80" y="560" width="1120" height="94" rx="8" fill="#007ACC"/>
  <text x="122" y="618" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">PixelMate is alive!</text>
  <rect x="140" y="120" width="1000" height="380" rx="10" fill="#252526" stroke="#3D3D3D"/>
  <text x="190" y="200" fill="#D4D4D4" font-family="Segoe UI, Arial, sans-serif" font-size="30">Extension Development Host</text>
  <text x="190" y="262" fill="#9CDCFE" font-family="Segoe UI, Arial, sans-serif" font-size="24">Runtime command executed successfully.</text>
  <text x="190" y="322" fill="#CE9178" font-family="Segoe UI, Arial, sans-serif" font-size="24">No companion behavior is included in this alpha.</text>
  <text x="80" y="690" fill="#BFBFBF" font-family="Segoe UI, Arial, sans-serif" font-size="20">PixelMate Runtime VS Code Host - Illustrative Marketplace Screenshot</text>
</svg>
