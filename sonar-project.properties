sonar.projectName=PixelMate
sonar.sourceEncoding=UTF-8

sonar.sources=apps,companions,packages
sonar.tests=apps,companions,packages
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.turbo/**,**/*.d.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/esbuild.mjs,**/vitest.config.ts,**/runtimeCompanionHost.ts

sonar.javascript.lcov.reportPaths=apps/runtime-vscode/coverage/lcov.info,companions/pixelmate-core/coverage/lcov.info,packages/animation/coverage/lcov.info,packages/asset-loader/coverage/lcov.info,packages/renderer/coverage/lcov.info
