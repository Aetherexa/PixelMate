name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish packages to npm"
        required: false
        default: false
        type: boolean
      publish_marketplace:
        description: "Publish the VS Code extension to the marketplace"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build

  package_extension:
    name: Package extension
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package VSIX
        run: pnpm extension:package
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: pixelmate-release-vsix
          path: apps/runtime-vscode/*.vsix
          if-no-files-found: error
          retention-days: 30

  github_release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package_extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download packaged VSIX
        uses: actions/download-artifact@v4
        with:
          name: pixelmate-release-vsix
          path: dist/release
      - name: Verify release notes
        shell: bash
        run: test -f RELEASE_NOTES.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/release/*.vsix

  marketplace_publish:
    name: Publish VS Code Marketplace
    if: github.event_name == 'workflow_dispatch' && inputs.publish_marketplace == true
    needs: package_extension
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish extension
        run: pnpm --filter pixelmate-runtime-vscode publish:vsce
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  npm_release:
    name: Publish npm packages
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm == true
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish packages
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
